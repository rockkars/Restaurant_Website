<!-- confirmation.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order Submitted</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body {
      background: #f8f9fa;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .message-box {
      background: #fff;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      text-align: center;
    }

    .message-box h1 {
      font-size: 2rem;
      color: green;
      margin-bottom: 20px;
    }

    .message-box p {
      font-size: 1.2rem;
      margin-bottom: 10px;
    }

    .cod-note {
      color: #dc3545;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="message-box">
    <h2 class="text-success">✅ Order Confirmed!</h2>
    <p>Thank you for your order. We'll start preparing it right away.</p>
    <a href="order.html" class="btn btn-primary mt-3">Place Another Order</a>
    <p class="cod-note">Payment method: Cash on Delivery</p>
  </div>
</body>
</html>
