<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Foodies Booking System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #ffecd2 0%, #fcb69f 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding-top: 2rem;
    }
    .card {
      border-radius: 2rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      border: none;
    }
    .btn-danger {
      background-color: #ff5722;
      border: none;
    }
    .btn-danger:hover {
      background-color: #e64a19;
    }
    .booking-item {
      transition: all 0.3s ease;
    }
    .booking-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .empty-state {
      text-align: center;
      padding: 2rem;
      color: #6c757d;
    }
    .empty-state i {
      font-size: 3rem;
      margin-bottom: 1rem;
      color: #ff5722;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-10 col-lg-8">
        <div class="card p-4">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mb-0">Your Reservations</h2>
            <button class="btn btn-outline-secondary" onclick="loadBookings()">
              Refresh
            </button>
          </div>
          
          <div id="bookingList">
            <!-- Empty state shown by default -->
            <div class="empty-state">
              <i class="bi bi-calendar-x"></i>
              <h4>No reservations found</h4>
              <p>You don't have any upcoming reservations.</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const bookingList = document.getElementById('bookingList');

    async function loadBookings() {
      try {
        const res = await fetch('/bookings');
        const bookings = await res.json();
        
        if (bookings.length === 0) {
          bookingList.innerHTML = `
            <div class="empty-state">
              <i class="bi bi-calendar-x"></i>
              <h4>No reservations found</h4>
              <p>You don't have any upcoming reservations.</p>
            </div>
          `;
          return;
        }
        
        bookingList.innerHTML = '<ul class="list-group"></ul>';
        const list = bookingList.querySelector('ul');
        
        bookings.forEach(booking => {
          const item = document.createElement('li');
          item.className = 'list-group-item booking-item mb-2 rounded';
          
          item.innerHTML = `
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <h5 class="mb-1">${booking.name}</h5>
                <p class="mb-1 text-muted">
                  <i class="bi bi-calendar"></i> ${booking.date} 
                  <i class="bi bi-clock ms-2"></i> ${booking.time}
                </p>
                <span class="badge bg-primary">${booking.people} ${booking.people > 1 ? 'people' : 'person'}</span>
                ${booking.phone ? `<p class="mt-1 mb-0"><i class="bi bi-telephone"></i> ${booking.phone}</p>` : ''}
              </div>
              <button class="btn btn-danger">
                <i class="bi bi-trash"></i> Cancel
              </button>
            </div>
          `;
          
          const cancelBtn = item.querySelector('button');
          cancelBtn.onclick = async () => {
            if (confirm('Are you sure you want to cancel this reservation?')) {
              try {
                const res = await fetch(`/cancel/${booking.id}`, { method: 'DELETE' });
                if (res.ok) {
                  item.classList.add('animate__animated', 'animate__fadeOut');
                  setTimeout(() => loadBookings(), 500);
                }
              } catch (error) {
                console.error('Error cancelling booking:', error);
                alert('Failed to cancel reservation. Please try again.');
              }
            }
          };
          
          list.appendChild(item);
        });
        
      } catch (error) {
        console.error('Error loading bookings:', error);
        bookingList.innerHTML = `
          <div class="alert alert-danger">
            Failed to load reservations. Please try again later.
          </div>
        `;
      }
    }

    // Load bookings on page load
    window.onload = loadBookings;
    
    // Add Bootstrap Icons
    const bi = document.createElement('link');
    bi.rel = 'stylesheet';
    bi.href = 'https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css';
    document.head.appendChild(bi);
  </script>
</body>
</html>
